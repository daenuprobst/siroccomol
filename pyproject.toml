[project]
name = "siroccomol"
version = "0.1.0"
description = "Illustrative space-filling molecular surface renderer -- matte and cel-shaded styles (headless GPU)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Daniel Probst" }]
keywords = ["molecular-graphics", "protein", "cel-shading", "raymarching", "moderngl", "isosurface"]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "moderngl>=5.8",
    "pillow>=9.0",
]

[project.scripts]
siroccomol = "siroccomol.cli:main"

[project.urls]
Homepage = "https://github.com/daenuprobst/siroccomol"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siroccomol"]
exclude = [
  "/gallery",
]
